##################################################################################
### GENERAL
##################################################################################

set -g default-shell $SHELL
# Older hosts lack the tmux-256color terminfo, and the fallback keeps redraws intact there.
if-shell 'infocmp tmux-256color > /dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
# Each version gate runs its command only if the running server is at least that
# version. It asks the server's binary, because the tmux on PATH may be newer.
# Hyperlinks (3.2+) make URLs in the terminal clickable.
if-shell 'v=$($(readlink /proc/$PPID/exe 2>/dev/null || command -v tmux) -V | cut -d" " -f2); [ "$(printf "%s\n3.2" "$v" | sort -V | head -1)" = "3.2" ]' \
  'set -ga terminal-features ",*:hyperlinks"' ''
# Extended keys (3.2+) pass combinations like Shift+Enter on to apps that ask for them.
if-shell 'v=$($(readlink /proc/$PPID/exe 2>/dev/null || command -v tmux) -V | cut -d" " -f2); [ "$(printf "%s\n3.2" "$v" | sort -V | head -1)" = "3.2" ]' \
  'set -s extended-keys on ; set -ga terminal-features ",xterm*:extkeys"' ''
# Passthrough (3.3+) lets apps' notifications and progress reach the outer terminal.
if-shell 'v=$($(readlink /proc/$PPID/exe 2>/dev/null || command -v tmux) -V | cut -d" " -f2); [ "$(printf "%s\n3.3" "$v" | sort -V | head -1)" = "3.3" ]' \
  'set -g allow-passthrough on' ''
# Apps learn when the terminal gains or loses focus, which vim's autoread needs.
set -g focus-events on
set -g history-limit 10000               # scrollback lines per pane
set -g base-index 1                      # window numbers start at 1
set -g renumber-windows on               # close the gap when a window closes
set -sg escape-time 10                   # ms to wait after Esc; 0 breaks some key sequences
setw -g aggressive-resize on             # size a window to the smallest client looking at it

##################################################################################
### KEYBINDINGS
##################################################################################

# prefix r reloads this file
bind r source-file ~/.tmux.conf \;

# use ctrl+n _without_ prefix to open windows
bind -n C-n new-window -c '#{pane_current_path}'

# use shift-arrow keys _without_ prefix to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# use ctrl-shift-arrow keys _without_ prefix key to switch panes
bind -n C-S-Left select-pane -L
bind -n C-S-Down select-pane -D
bind -n C-S-Up select-pane -U
bind -n C-S-Right select-pane -R

# use more intuitive keys to split windows into panes (|: vertically, -: horizontally)
bind | split-window -h
bind - split-window -v

# copy mode
setw -g mode-keys vi                     # vi keys in copy mode
set -g mouse on
set -g set-clipboard on                  # copies reach the system clipboard (OSC 52)
bind v copy-mode

# mouse wheel enters copy mode automatically
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# PageUp scrolls into copy mode, which touch clients send on swipe. Full-screen apps like vim still get the key.
bind -n PageUp if -F '#{alternate_on}' 'send-keys PageUp' 'copy-mode -eu'

# copy to osx clipboard
bind-key -T copy-mode-vi 'v'               send -X begin-selection
bind-key -T copy-mode-vi y                 send -X copy-selection
bind-key -T copy-mode-vi Enter             send -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
bind-key -T copy-mode-vi Escape            send -X cancel
bind-key -T copy-mode-vi q                 send -X cancel
bind-key -T copy-mode-vi r                 send -X rectangle-toggle
bind-key -T copy-mode-vi /                 command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ?                 command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""
bind p paste-buffer

##################################################################################
### THEME
##################################################################################

# Windows keep the name a program sets, as the dir function does; tmux never renames them itself.
set -g allow-rename on
set -g automatic-rename off
set-option -g status-interval 1          # redraw the status bar every second

# Light until a theme is detected. From 3.8 tmux follows the terminal itself; older
# servers rely on tmux-sync-theme in .zshrc.
source-file ~/.tmux-light.conf
if-shell 'v=$($(readlink /proc/$PPID/exe 2>/dev/null || command -v tmux) -V | cut -d" " -f2); [ "$(printf "%s\n3.8" "$v" | sort -V | head -1)" = "3.8" ]' \
  'set -g theme detect ; set-hook -g client-light-theme "set -g @theme light ; source-file ~/.tmux-light.conf" ; set-hook -g client-dark-theme "set -g @theme dark ; source-file ~/.tmux-dark.conf"' ''

# On attach, ask the active pane's zsh to re-check the terminal (TRAPUSR1 in .zshrc). A hook
# cannot query the client's terminal itself. Only a pane whose foreground is zsh gets the signal.
set-hook -g client-attached 'if-shell -F "#{==:#{pane_current_command},zsh}" "run-shell \"kill -USR1 #{pane_pid}\""'

